<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="description" content="Smart Farming Decision System - Operator Login"/>
<title>Login | AgriPulse AI — Smart Farming</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{colors:{"secondary-fixed":"#d8e2ff","on-surface":"#dde4dd","primary-container":"#10b981","on-surface-variant":"#bbcabf","on-primary-fixed":"#002113","surface-container-high":"#242c27","secondary-container":"#0566d9","primary":"#4edea3","on-error":"#690005","surface-container-highest":"#2f3632","surface-container-lowest":"#09100c","error-container":"#93000a","on-primary-container":"#00422b","error":"#ffb4ab","surface-container":"#1a211d","background":"#0e1511","secondary":"#adc6ff","surface":"#0e1511","outline-variant":"#3c4a42","primary-fixed-dim":"#4edea3","on-primary":"#003824","primary-fixed":"#6ffbbe","surface-variant":"#2f3632","surface-bright":"#343b36","on-secondary-container":"#e6ecff","surface-container-low":"#161d19","outline":"#86948a"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{md:"16px",lg:"24px",sm:"8px",gutter:"20px",unit:"4px",xs:"4px","container-max":"1280px",xl:"40px"},fontFamily:{"display-lg":["Inter"],"coordinate-xs":["JetBrains Mono"],"data-mono":["JetBrains Mono"],"body-base":["Inter"],h2:["Inter"],h1:["Inter"],"body-sm":["Inter"]},fontSize:{"display-lg":["48px",{lineHeight:"1.1",letterSpacing:"-0.02em",fontWeight:"700"}],"coordinate-xs":["11px",{lineHeight:"1.2",fontWeight:"600"}],"data-mono":["14px",{lineHeight:"1.4",letterSpacing:"0.02em",fontWeight:"500"}],"body-base":["16px",{lineHeight:"1.6",fontWeight:"400"}],h2:["24px",{lineHeight:"1.3",fontWeight:"600"}],h1:["32px",{lineHeight:"1.2",fontWeight:"600"}],"body-sm":["14px",{lineHeight:"1.5",fontWeight:"400"}]}}}}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.glass-panel{background:rgba(255,255,255,.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
.gradient-bg{background:radial-gradient(circle at top right,rgba(16,185,129,.15),transparent),radial-gradient(circle at bottom left,rgba(59,130,246,.1),transparent),#0e1511}
.primary-gradient{background:linear-gradient(135deg,#10b981 0%,#059669 100%);box-shadow:0 4px 20px -4px rgba(16,185,129,.4)}
.pulse-dot{width:8px;height:8px;background:#4edea3;border-radius:50%;display:inline-block;margin-right:8px;box-shadow:0 0 8px #4edea3;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.err-msg{display:none;color:#ffb4ab;font-size:.8rem;margin-top:6px;padding:8px 12px;background:rgba(147,0,10,.2);border:1px solid rgba(255,180,171,.3);border-radius:6px}
.err-msg.show{display:block}
input[type=text],input[type=password]{border:1px solid #3c4a42}
</style>
</head>
<body class="bg-background text-on-background font-body-base min-h-screen flex flex-col items-center justify-center gradient-bg overflow-x-hidden">

<!-- Background blobs -->
<div class="fixed inset-0 pointer-events-none opacity-30">
  <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-primary-container rounded-full blur-[120px]"></div>
  <div class="absolute bottom-[-10%] left-[-5%] w-[400px] h-[400px] bg-secondary-container rounded-full blur-[100px]"></div>
</div>

<main class="w-full max-w-[440px] px-md relative z-10">
  <!-- Logo -->
  <div class="flex flex-col items-center mb-xl text-center">
    <div class="w-16 h-16 bg-primary-container/20 rounded-xl flex items-center justify-center mb-md border border-primary/30">
      <span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings:'FILL' 1">psychiatry</span>
    </div>
    <h1 class="font-h1 text-h1 text-primary-fixed tracking-tighter mb-xs">AgriPulse AI</h1>
    <p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px]">Smart Farming Decision System &amp; Neural Insights</p>
  </div>

  <!-- Card -->
  <div class="glass-panel rounded-xl p-xl shadow-2xl shadow-black/50">
    <div class="mb-lg">
      <div class="flex items-center gap-xs mb-unit">
        <span class="pulse-dot"></span>
        <span class="font-coordinate-xs text-coordinate-xs text-primary uppercase tracking-widest">System Ready</span>
      </div>
      <h2 class="font-h2 text-h2 text-on-surface">Operator Authentication</h2>
    </div>

    <div class="err-msg" id="loginError">Invalid credentials. Please try again.</div>

    <form id="loginForm" class="space-y-lg" novalidate>
      <div class="space-y-xs">
        <label class="font-coordinate-xs text-coordinate-xs text-on-surface-variant uppercase tracking-wider ml-unit">Email / Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">alternate_email</span>
          <input id="loginUsername" name="email" type="text" autocomplete="email" placeholder="abc@123" value="abc@123" required
            class="w-full bg-surface-container-highest/50 rounded-lg py-md pl-xl pr-md font-data-mono text-data-mono text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all placeholder:text-on-surface-variant/30"/>
        </div>
      </div>

      <div class="space-y-xs">
        <label class="font-coordinate-xs text-coordinate-xs text-on-surface-variant uppercase tracking-wider ml-unit">Access Key</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock_open</span>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="••••••••••••" value="1234" required
            class="w-full bg-surface-container-highest/50 rounded-lg py-md pl-xl pr-md font-data-mono text-data-mono text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all placeholder:text-on-surface-variant/30"/>
        </div>
      </div>

      <button id="loginBtn" type="submit"
        class="w-full primary-gradient text-on-primary-container font-bold text-lg py-md rounded-lg active:scale-95 transition-transform flex items-center justify-center gap-md">
        Initialize Session
        <span class="material-symbols-outlined">login</span>
      </button>
    </form>

    <div class="flex items-center gap-md my-lg">
      <div class="h-[1px] flex-1 bg-outline-variant/30"></div>
      <span class="font-coordinate-xs text-coordinate-xs text-on-surface-variant uppercase">New Operator</span>
      <div class="h-[1px] flex-1 bg-outline-variant/30"></div>
    </div>

    <p class="text-center font-body-sm text-body-sm text-on-surface-variant">
      No account yet? <a href="/register" class="text-primary font-semibold hover:underline">Provision Hub →</a>
    </p>
  </div>
</main>

<footer class="mt-auto w-full py-lg">
  <div class="flex flex-col items-center gap-md px-md">
    <p class="font-coordinate-xs text-[10px] text-on-surface-variant/40 tracking-[0.2em]">© 2024 AGRIPULSE AI. PRECISION DATA SYSTEMS.</p>
  </div>
</footer>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');

  const email = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    errEl.textContent = 'Please enter both email and access key.';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = 'Authenticating... <span class="material-symbols-outlined">autorenew</span>';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password })
    });
    const data = await response.json();
    if (response.ok && data.success) {
      btn.innerHTML = 'Access Granted <span class="material-symbols-outlined">check_circle</span>';
      window.location.href = data.redirect || '/dashboard';
    } else {
      errEl.textContent = data.message || 'Invalid credentials. Please try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Initialize Session <span class="material-symbols-outlined">login</span>';
    }
  } catch (err) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = 'Initialize Session <span class="material-symbols-outlined">login</span>';
  }
});
</script>
</body>
</html>
